name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Infinitygram.Windows.sln -c Release
      - run: dotnet run --project tests/Infinitygram.Runner -c Release
      - run: dotnet publish src/Infinitygram.App/Infinitygram.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Infinitygram-Windows
          path: dist/win-x64

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Infinitygram.Windows.sln -c Release
      - run: dotnet run --project tests/Infinitygram.Runner -c Release
